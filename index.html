<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guardadinho">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Guardadinho</title>
<style>
:root{--g:#0f3d2e;--g2:#1d6b52;--in:#1f9a5c;--in-bg:#e3f5eb;--out:#d0503f;--out-bg:#fbe8e5;--bg:#f6f5f0;--card:#fff;--tx:#14211b;--mu:#7b8780;--ln:#ebe8df;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 14px) 20px 10px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
main{padding:4px 16px calc(96px + var(--bot));max-width:560px;margin:0 auto}
.view{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hero{background:var(--g);color:#fff}
.hero small{opacity:.7;font-size:13px;font-weight:600}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:2px 0 16px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio span{display:block;font-size:11.5px;opacity:.7;font-weight:600}
.trio b{font-size:15px;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.act{padding:16px;border-radius:18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.act:active,.btn:active{transform:scale(.97)}
.act.in{background:var(--in-bg);color:var(--in)}.act.out{background:var(--out-bg);color:var(--out)}
.ttl{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.ttl small{color:var(--mu);font-weight:600;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
.dot.in{background:var(--in-bg)}.dot.out{background:var(--out-bg)}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid span{font-size:12.5px;color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.day{font-size:12px;font-weight:700;color:var(--mu);margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;color:var(--mu);padding:26px 8px;font-size:15px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px;text-transform:capitalize}
.mbtn{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;font-weight:700}
.seg{display:flex;background:#ebe9e1;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bar{width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px;transition:height .5s ease}
.bar.in{background:var(--in)}.bar.out{background:var(--g)}
.col small{font-size:11px;color:var(--mu);font-weight:600;text-transform:capitalize}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px;font-weight:600}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:15px}
.row:last-child{border:0}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.chip.good{background:var(--in-bg);color:var(--in)}.chip.bad{background:var(--out-bg);color:var(--out)}
.btn{width:100%;padding:15px;border-radius:15px;background:var(--g);color:#fff;font-weight:700;font-size:16px;transition:transform .12s}
.btn.ghost{background:#ebe9e1;color:var(--tx)}.btn.del{background:var(--out-bg);color:var(--out)}
.btn+.btn{margin-top:10px}
.note{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.45}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + var(--bot))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 0}
nav button.on{color:var(--g)}
nav svg{width:24px;height:24px}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,25,19,.4);opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--bot));max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#d6d3c8;margin:0 auto 12px}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:12px;text-align:center}
.val{width:100%;text-align:center;font-size:42px;font-weight:800;letter-spacing:-.03em;padding:8px 0;outline:none}
.val.in{color:var(--in)}.val.out{color:var(--out)}
.fld{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mu);padding-top:8px}
.fld input,.fld select{width:100%;padding:4px 0 10px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none;background:transparent}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.cats button{padding:8px 12px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;border:1.5px solid transparent}
.cats button.on{border-color:var(--g);background:#e7f0eb}
.err{color:var(--out);font-size:13px;font-weight:600;text-align:center;min-height:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-20px);opacity:0;z-index:99;background:var(--g);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1 id="title">Guardadinho</h1></header>
<main id="main"></main>

<nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Histórico</button>
  <button data-v="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg>Resumo</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Ajustes</button>
</nav>

<div class="ov hidden" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json,application/json" class="hidden">

<script>
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2=v=>Math.round(v*100)/100;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curYM=()=>today().slice(0,7);
const ymAdd=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mLong=ym=>{const[y,m]=ym.split('-');return MES[m-1]+' '+y};
const mShort=ym=>MES[+ym.slice(5)-1].slice(0,3);
const fDay=ds=>{const[y,m,d]=ds.split('-').map(Number);const w=new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');return ds===today()?'Hoje':`${w}, ${d} de ${MES[m-1]}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000)}
function parseVal(s){s=String(s).replace(/[^\d,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)}

const CATS={
  in:[['Salário','💼'],['Freela','🧑‍💻'],['Vendas','🛒'],['Pix recebido','💸'],['Outros','✨']],
  out:[['Alimentação','🍽️'],['Mercado','🧺'],['Transporte','🚗'],['Casa','🏠'],['Contas','🧾'],['Lazer','🎉'],['Saúde','🩺'],['Compras','🛍️'],['Educação','📚'],['Outros','✨']]
};
const icon=(type,cat)=>(CATS[type].find(c=>c[0]===cat)||['','✨'])[1];

/* ===== Armazenamento (IndexedDB, persistente e offline) ===== */
const DB={
  db:null,
  open(){return new Promise((ok,ko)=>{const r=indexedDB.open('guardadinho',1);r.onupgradeneeded=()=>r.result.createObjectStore('tx',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>ko(r.error)})},
  st(m){return this.db.transaction('tx',m).objectStore('tx')},
  req(r){return new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})},
  all(){return this.req(this.st('readonly').getAll())},
  put(o){return this.req(this.st('readwrite').put(o))},
  del(id){return this.req(this.st('readwrite').delete(id))},
  replaceAll(list){return new Promise((ok,ko)=>{const t=this.db.transaction('tx','readwrite');const s=t.objectStore('tx');s.clear();list.forEach(o=>s.put(o));t.oncomplete=ok;t.onerror=()=>ko(t.error)})}
};
let TX=[];
async function load(){TX=(await DB.all()).map(t=>({...t,amount:Number(t.amount)}))}

/* ===== Cálculos ===== */
const sum=a=>r2(a.reduce((s,t)=>s+t.amount,0));
const ofM=ym=>TX.filter(t=>t.date.startsWith(ym));
const inM=ym=>sum(ofM(ym).filter(t=>t.type==='in'));
const outM=ym=>sum(ofM(ym).filter(t=>t.type==='out'));
const balance=()=>r2(sum(TX.filter(t=>t.type==='in'))-sum(TX.filter(t=>t.type==='out')));
const sorted=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));

/* ===== Navegação ===== */
let view='home', histYM=curYM(), histType='all', sumYM=curYM();
const TITLES={home:'Guardadinho',hist:'Histórico',sum:'Resumo',set:'Ajustes'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#title').textContent=TITLES[view];
  const m=$('#main'); m.innerHTML=`<div class="view">${({home:vHome,hist:vHist,sum:vSum,set:vSet})[view]()}</div>`;
  m.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openForm(null,TX.find(t=>t.id===e.dataset.id)));
  m.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>openForm(e.dataset.add));
  bind[view]&&bind[view](m);
}
const itemHTML=t=>`<div class="item" data-id="${t.id}"><div class="dot ${t.type}">${icon(t.type,t.category)}</div><div class="mid"><b>${esc(t.desc)}</b><span>${esc(t.category)}</span></div><div class="amt ${t.type}">${t.type==='in'?'+':'−'} ${brl(t.amount)}</div></div>`;

function chartHTML(n=6){
  const ms=Array.from({length:n},(_,i)=>ymAdd(curYM(),i-n+1));
  const d=ms.map(m=>[inM(m),outM(m)]); const max=Math.max(1,...d.flat());
  return `<div class="chart">${ms.map((m,i)=>`<div class="col"><div class="bars"><div class="bar in" style="height:${d[i][0]/max*100}%"></div><div class="bar out" style="height:${d[i][1]/max*100}%"></div></div><small>${mShort(m)}</small></div>`).join('')}</div><div class="leg"><span><i style="background:var(--in)"></i>Entradas</span><span><i style="background:var(--g)"></i>Saídas</span></div>`;
}

/* ===== Telas ===== */
function vHome(){
  const ym=curYM(), i=inM(ym), o=outM(ym), recent=sorted(TX).slice(0,5);
  return `<div class="card hero"><small>Saldo atual</small><div class="big">${brl(balance())}</div>
    <div class="trio"><div><span>Entradas</span><b>${brl(i)}</b></div><div><span>Saídas</span><b>${brl(o)}</b></div><div><span>Sobrou</span><b>${brl(i-o)}</b></div></div></div>
  <div class="acts"><button class="act in" data-add="in">＋ Entrada</button><button class="act out" data-add="out">− Saída</button></div>
  <div class="card"><div class="ttl">Entradas e saídas <small>6 meses</small></div>${chartHTML()}</div>
  <div class="card"><div class="ttl">Últimas movimentações</div>${recent.length?recent.map(itemHTML).join(''):'<div class="empty">Nada registrado ainda.<br>Toque em Entrada ou Saída para começar.</div>'}</div>`;
}
function vHist(){
  let l=sorted(ofM(histYM)); if(histType!=='all') l=l.filter(t=>t.type===histType);
  const g={}; l.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return `<div class="mnav"><button class="mbtn" id="hp">‹</button><b>${mLong(histYM)}</b><button class="mbtn" id="hn">›</button></div>
  <div class="seg">${[['all','Todas'],['in','Entradas'],['out','Saídas']].map(([v,l])=>`<button data-t="${v}" class="${histType===v?'on':''}">${l}</button>`).join('')}</div>
  <div class="card" style="display:flex;justify-content:space-around;text-align:center;padding:14px"><div><small class="muted" style="font-size:12px;color:var(--mu)">Entradas</small><div class="amt in">${brl(inM(histYM))}</div></div><div><small style="font-size:12px;color:var(--mu)">Saídas</small><div class="amt out">${brl(outM(histYM))}</div></div></div>
  ${l.length?Object.keys(g).map(d=>`<div class="day">${fDay(d)}</div><div class="card" style="padding:4px 16px">${g[d].map(itemHTML).join('')}</div>`).join(''):'<div class="card empty">Nenhuma movimentação neste mês.</div>'}`;
}
function vSum(){
  const i=inM(sumYM),o=outM(sumYM),p=ymAdd(sumYM,-1),pi=inM(p),po=outM(p);
  const cmp=(a,b,goodUp)=>{if(!b)return'<span style="color:var(--mu);font-size:13px">—</span>';const v=(a-b)/b*100;const good=goodUp?v>=0:v<=0;return `<span class="chip ${good?'good':'bad'}">${v>=0?'+':''}${v.toFixed(0)}%</span>`};
  const cats={};ofM(sumYM).filter(t=>t.type==='out').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);
  const ck=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const ms=Array.from({length:6},(_,k)=>ymAdd(sumYM,-k));
  return `<div class="mnav"><button class="mbtn" id="sp">‹</button><b>${mLong(sumYM)}</b><button class="mbtn" id="sn">›</button></div>
  <div class="card">
    <div class="row"><span>Total recebido</span><b class="amt in">${brl(i)}</b></div>
    <div class="row"><span>Total gasto</span><b class="amt out">${brl(o)}</b></div>
    <div class="row"><span>Saldo restante</span><b>${brl(i-o)}</b></div></div>
  <div class="card"><div class="ttl">Comparado a ${mLong(p)}</div>
    <div class="row"><span>Recebido</span><span>${brl(pi)} &nbsp;${cmp(i,pi,true)}</span></div>
    <div class="row"><span>Gasto</span><span>${brl(po)} &nbsp;${cmp(o,po,false)}</span></div>
    <div class="row"><span>Sobrou</span><span>${brl(pi-po)}</span></div></div>
  ${ck.length?`<div class="card"><div class="ttl">Onde você gastou</div>${ck.map(([c,v])=>`<div class="row"><span>${icon('out',c)} ${esc(c)}</span><span><b>${brl(v)}</b> <small style="color:var(--mu)">${Math.round(v/o*100)}%</small></span></div>`).join('')}</div>`:''}
  <div class="card"><div class="ttl">Meses anteriores</div>${ms.map(m=>{const a=inM(m),b=outM(m);return `<div class="row"><span style="text-transform:capitalize">${mLong(m)}</span><span style="text-align:right;font-size:13.5px"><span class="amt in">+${brl(a)}</span> · <span class="amt out">−${brl(b)}</span><br><b>${brl(a-b)}</b></span></div>`}).join('')}</div>`;
}
function vSet(){
  return `<div class="card"><div class="ttl">Seus dados</div>
    <button class="btn" id="csv">Exportar CSV</button>
    <button class="btn ghost" id="bk">Fazer backup</button>
    <button class="btn ghost" id="rs">Restaurar backup</button>
    <p class="note">Tudo fica salvo só neste iPhone, sem login e sem internet. Faça backup de vez em quando e guarde o arquivo no app Arquivos ou no iCloud Drive.</p></div>
  <div class="card"><div class="ttl">Instalar no iPhone</div><p class="note" style="margin:0">No Safari, toque em Compartilhar → <b>Adicionar à Tela de Início</b>.</p></div>
  <div class="card"><div class="ttl">Zona de perigo</div><button class="btn del" id="wipe">Apagar todos os dados</button></div>
  <p class="note" style="text-align:center">${TX.length} movimentações registradas · Guardadinho</p>`;
}
const bind={
  hist(m){m.querySelector('#hp').onclick=()=>{histYM=ymAdd(histYM,-1);render()};m.querySelector('#hn').onclick=()=>{histYM=ymAdd(histYM,1);render()};m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{histType=b.dataset.t;render()})},
  sum(m){m.querySelector('#sp').onclick=()=>{sumYM=ymAdd(sumYM,-1);render()};m.querySelector('#sn').onclick=()=>{sumYM=ymAdd(sumYM,1);render()}},
  set(m){m.querySelector('#csv').onclick=exportCSV;m.querySelector('#bk').onclick=backup;m.querySelector('#rs').onclick=()=>$('#file').click();
    m.querySelector('#wipe').onclick=()=>confirmSheet('Apagar todos os dados?','Isso não pode ser desfeito. Faça um backup antes.','Apagar tudo',async()=>{await DB.replaceAll([]);await load();toast('Dados apagados');render()})}
};

/* ===== Folha de cadastro/edição ===== */
function showSheet(html){const s=$('#sheet'),o=$('#ov');s.innerHTML='<div class="grab"></div>'+html;o.classList.remove('hidden');requestAnimationFrame(()=>{o.classList.add('show');s.classList.add('show')})}
function closeSheet(){const s=$('#sheet'),o=$('#ov');s.classList.remove('show');o.classList.remove('show');setTimeout(()=>o.classList.add('hidden'),250)}
$('#ov').onclick=closeSheet;

function openForm(type,t=null){
  type=t?t.type:type; let cat=t?t.category:CATS[type][0][0];
  showSheet(`<h2>${t?'Editar':'Nova'} ${type==='in'?'entrada':'saída'}</h2>
    <form id="f" novalidate>
    <input class="val ${type}" id="v" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off" value="${t?brl(t.amount):''}">
    <div class="err" id="e"></div>
    <div class="fld"><label>Descrição</label><input id="d" maxlength="80" placeholder="${type==='in'?'Ex.: Salário':'Ex.: Almoço'}" value="${esc(t?.desc||'')}" autocomplete="off"></div>
    <div class="cats" id="c">${CATS[type].map(([n,i])=>`<button type="button" data-c="${esc(n)}" class="${n===cat?'on':''}">${i} ${esc(n)}</button>`).join('')}</div>
    <div class="fld"><label>Data</label><input id="dt" type="date" value="${t?.date||today()}"></div>
    <button class="btn" type="submit">${t?'Salvar':'Adicionar'}</button>
    ${t?'<button class="btn del" type="button" id="x">Excluir</button>':''}
    <button class="btn ghost" type="button" id="cn">Cancelar</button></form>`);
  const v=$('#v');
  v.oninput=()=>{const dg=v.value.replace(/\D/g,'').slice(0,11);v.value=dg?brl(Number(dg)/100):''};
  $('#c').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;$('#c').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#cn').onclick=closeSheet;
  if(!t) setTimeout(()=>v.focus(),300);
  $('#f').onsubmit=async e=>{e.preventDefault();
    const amount=r2(parseVal(v.value)), desc=$('#d').value.trim()||cat, date=$('#dt').value;
    if(!(amount>0)) return $('#e').textContent='Digite um valor maior que zero.';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return $('#e').textContent='Escolha uma data válida.';
    const o={id:t?.id||uid(),type,amount,desc,category:cat,date,created:t?.created||Date.now()};
    try{await DB.put(o);await load();closeSheet();toast(t?'Alterado':'Registrado');render()}catch(err){$('#e').textContent='Não foi possível salvar: '+err.message}
  };
  if(t) $('#x').onclick=()=>confirmSheet('Excluir movimentação?',`${esc(t.desc)} · ${brl(t.amount)}`,'Excluir',async()=>{await DB.del(t.id);await load();toast('Excluído');render()});
}
function confirmSheet(title,text,label,fn){
  showSheet(`<h2>${title}</h2><p class="note" style="text-align:center;margin-bottom:16px">${text}</p><button class="btn del" id="ok">${label}</button><button class="btn ghost" id="no">Cancelar</button>`);
  $('#no').onclick=closeSheet; $('#ok').onclick=async()=>{closeSheet();try{await fn()}catch(e){toast('Erro: '+e.message)}};
}

/* ===== Exportar / Backup / Restaurar ===== */
function download(name,content,type){
  const blob=new Blob([content],{type});const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportCSV(){
  if(!TX.length) return toast('Nada para exportar');
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const rows=sorted(TX).map(t=>[t.date.split('-').reverse().join('/'),t.type==='in'?'Entrada':'Saída',t.desc,t.category,(t.type==='in'?t.amount:-t.amount).toFixed(2).replace('.',',')].map(q).join(';'));
  download(`guardadinho-${today()}.csv`,'﻿'+['Data','Tipo','Descrição','Categoria','Valor'].map(q).join(';')+'\n'+rows.join('\n'),'text/csv');
}
function backup(){download(`guardadinho-backup-${today()}.json`,JSON.stringify({app:'guardadinho',version:1,exported:new Date().toISOString(),transactions:TX},null,1),'application/json')}
$('#file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); const list=data?.transactions;
    if(data?.app!=='guardadinho'||!Array.isArray(list)) throw new Error('Arquivo não é um backup do Guardadinho.');
    const ok=list.filter(t=>t&&t.id&&(t.type==='in'||t.type==='out')&&Number(t.amount)>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date))
      .map(t=>({id:String(t.id),type:t.type,amount:r2(Number(t.amount)),desc:String(t.desc||'').slice(0,80)||'Sem descrição',category:String(t.category||'Outros'),date:t.date,created:Number(t.created)||0}));
    confirmSheet('Restaurar backup?',`${ok.length} movimentações serão restauradas e vão substituir os dados atuais.`,'Restaurar',async()=>{await DB.replaceAll(ok);await load();toast('Backup restaurado');render()});
  }catch(err){toast(err.message.includes('JSON')?'Arquivo inválido':err.message)}
};

/* ===== Início ===== */
(async()=>{
  try{await DB.open();await load()}catch(e){$('#main').innerHTML='<div class="card empty">Não foi possível abrir o armazenamento. Saia do modo de navegação privada e tente de novo.</div>';return}
  navigator.storage?.persist?.();
  render();
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js');
})();
</script>
